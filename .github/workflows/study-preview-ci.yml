
name: Study Preview CI

on:
  push:
    branches:
      - study-roadmap-preview
  pull_request:
    branches:
      - assistant-development

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types, and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Upload regenerated package lock
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Run all tests
        run: npx vitest run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
